# SYLTHARAE — TLS reverse proxy for a single local application process.
#
# Install:   cp deploy/nginx/syltharae.conf /etc/nginx/sites-available/syltharae
#            ln -s ../sites-available/syltharae /etc/nginx/sites-enabled/
#            nginx -t && systemctl reload nginx
#
# Drop-in:   keep local overrides in conf.d/syltharae-local.conf rather than
#            editing this file, so an upgrade can replace it.

upstream syltharae {
    # One process, on loopback only. The application is single-process by
    # design (bounded in-process worker threads); adding a second upstream
    # entry would give two writers the same checkpoint journal.
    server 127.0.0.1:5000;

    keepalive 32;
}

# DEPLOY-H2-GOAWAY: at nginx's default keepalive_requests (1000) the browser's
# HTTP/2 connection was closed every ~20 page views, and the scripts a page had
# just requested on it failed with net::ERR_FAILED — handlers that were never
# defined. The request ceiling is therefore far above a session's request
# count, and keepalive_time bounds the connection's lifetime instead.
# These are set in the events-eligible server context below.

# --- HTTP: redirect everything to HTTPS ------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name _;

    server_tokens off;

    # ACME HTTP-01 challenge; everything else goes to HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS ------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/syltharae/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/syltharae/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SYLTHARAE:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # DEPLOY-H2-GOAWAY, applied.
    keepalive_requests 100000;
    keepalive_time 1h;
    keepalive_timeout 75s;

    # Uploads: matches OPERATIONS_MAX_UPLOAD_MB (2048) in the application.
    client_max_body_size 2g;

    # Long-running work (ingestion, reports, exports) streams through SSE, so
    # the proxy must not time out mid-job.
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_connect_timeout 10s;

    # Security headers are emitted by the application, including
    # Strict-Transport-Security, Content-Security-Policy and Referrer-Policy.
    # They are deliberately not repeated here: a second HSTS header would be
    # combined with the application's rather than replace it, and two CSPs
    # would both be enforced. If a header must be overridden for a proxy-level
    # path, add it in conf.d and remove the application's copy instead of
    # # them here too
    # (nothing follows this comment on purpose).

    # --- forwarded headers -------------------------------------------------
    # X-Forwarded-For is SET to $remote_addr, not appended with
    # $proxy_add_x_forwarded_for. Appending would forward whatever the client
    # sent, and with TRUSTED_PROXY_COUNT=1 the application trusts the last
    # hop — so a client could choose its own address and bypass rate limits
    # and the lockout. The only trustworthy value is the address nginx saw.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Real-IP $remote_addr;

    location / {
        proxy_pass http://syltharae;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Server-Sent Events (job progress, cursor pagination). The application
    # sends X-Accel-Buffering: no on these routes; disabling proxy_buffering
    # here as well keeps a mis-set header from stalling a stream.
    location ~ ^/api/(jobs|operations|cursor)/ {
        proxy_pass http://syltharae;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;
    }

    # Static assets are served by the application so that a single place owns
    # caching and the CSP. Uncomment to serve them directly, and keep the
    # cache headers consistent with the application's.
    #
    # location /static/ {
    #     alias /opt/syltharae/static/;
    #     expires 7d;
    #     add_header Cache-Control "public, immutable";
    # }
}
