# Message extraction.
#
# Patterns must stay root-relative globs (`**.py`), not path-prefixed ones: an
# extraction run may be pointed at a single package (the determinism test in
# tests/unit/test_catalog_extraction.py runs it over core/ and services/),
# and `core/**.py` then matches nothing because Babel matches against the path
# relative to the input directory.
#
# The trees that must never be read are excluded explicitly. Extraction used to
# scan everything, so it also harvested build/lib (a stale copy of the
# templates from an earlier wheel build), tests/ (assertion strings) and
# test-doc/ (688 third-party documents, 67 MB) - which is how a catalog ends up
# carrying 550 entries no runtime path can look up.
[python: **.py]
[jinja2: **/templates/**.html]
[jinja2: **/templates/**.inc.jinja]

[ignore: **/build/**]
[ignore: **/dist/**]
[ignore: **/tests/**]
[ignore: **/test-doc/**]
[ignore: **/node_modules/**]
[ignore: **/.venv/**]
[ignore: **/audit_report/**]

extensions=jinja2.ext.i18n
