# Message extraction for every user-visible string.
#
# AUDIT-I18N-02: the patterns below are anchored at the repository root and the
# generated/third-party trees are excluded explicitly. Extraction used to scan
# everything (`**.py`, `**/templates/**.html`), so it also harvested:
#   * build/lib/... - a stale copy of the templates from an earlier wheel build,
#     which injected duplicate references and long-dead msgids;
#   * tests/ - assertion strings that are never displayed;
#   * test-doc/ - 688 third-party documents (67 MB) in six languages.
# The re-extracted catalog dropped 550 entries no runtime path could look up and
# carried a bogus plural pair ("msgid"/"msgid_plural") into all five locales.

[python: Api/**.py]
[python: apps/**.py]
[python: concurrency/**.py]
[python: core/**.py]
[python: database/**.py]
[python: pipeline/**.py]
[python: reader_file/**.py]
[python: services/**.py]
[python: settings/**.py]
[python: Hdg_Err_Ex_Log/**.py]
[python: run_web.py]
[python: run_cli.py]
[python: run_import.py]
[python: install.py]
[python: version.py]
[python: verify_readiness.py]

[jinja2: templates/**.html]
[jinja2: templates/**.inc.jinja]

[ignore: build/**]
[ignore: dist/**]
[ignore: tests/**]
[ignore: test-doc/**]
[ignore: node_modules/**]
[ignore: .venv/**]
[ignore: static/vendor/**]

extensions=jinja2.ext.i18n
